[workspace]
members = ["runtime"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
libc = "0.2"
tempfile = "3"
local-package-runtime = { path = "runtime" }

[package]
name = "local-package"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local package file ownership, verification and durable installation transactions"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
local-package-runtime = { workspace = true }

[profile.dev.package.sha2]
opt-level = 3
